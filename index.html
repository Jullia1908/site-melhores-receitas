<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melhores Receitas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Referência para o arquivo JS externo -->
  <script src="formulario.js" defer></script>
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Cadastre a Sua Receita</h2>
    <form id="formReceita" enctype="multipart/form-data">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome da Receita</label>
        <input type="text" class="form-control" id="nome" name="nome" required />
      </div>

<div class="mb-3">
  <label for="ingredientes" class="form-label">Ingredientes (pressione Enter para nova linha)</label>
  <textarea class="form-control" id="ingredientes" name="listaIngred" rows="5" required></textarea>
  <div class="mt-2">
    <strong>Pré-visualização dos ingredientes:</strong>
    <ul id="previewIngredientes"></ul>
  </div>
</div>

<div class="mb-3">
  <label for="modo" class="form-label">Modo de Preparo (pressione Enter para nova linha)</label>
  <textarea class="form-control" id="modo" name="listaPrep" rows="5" required></textarea>
  <div class="mt-2">
    <strong>Pré-visualização do modo de preparo:</strong>
    <ol id="previewModo"></ol>
  </div>
</div>


      <div class="mb-3">
        <label for="foto" class="form-label">Foto da Receita</label>
        <input type="file" class="form-control" id="foto" name="foto" accept="image/*" required />
      </div>

      <button type="submit" class="btn btn-success">Cadastrar Receita</button>
    </form>

    <div id="resultado" class="mt-5"></div>
  </div>
</body>
</html>
